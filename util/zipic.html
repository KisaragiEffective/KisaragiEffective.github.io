<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZIP Photo Viewer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Fraunces:ital,wght@0,100;0,400;1,100&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
–bg: #0e0e0f;
–surface: #161618;
–surface2: #1e1e21;
–border: #2a2a2e;
–text: #e8e6e0;
–muted: #6b6966;
–accent: #c8a96e;
–accent2: #7c6fa0;
–danger: #c06060;
–folder: #8fb8d0;
}

html, body {
height: 100%;
background: var(–bg);
color: var(–text);
font-family: ‘DM Mono’, monospace;
font-size: 13px;
overflow: hidden;
}

/* ── Drop zone ── */
#dropzone {
position: fixed; inset: 0;
display: flex; flex-direction: column;
align-items: center; justify-content: center;
gap: 24px;
transition: opacity .3s, pointer-events .3s;
z-index: 10;
}
#dropzone.hidden { opacity: 0; pointer-events: none; }

.drop-ring {
width: 220px; height: 220px;
border: 1.5px solid var(–border);
border-radius: 50%;
display: flex; align-items: center; justify-content: center;
position: relative;
transition: border-color .2s;
}
#dropzone.dragging .drop-ring { border-color: var(–accent); }
.drop-ring::before {
content: ‘’;
position: absolute; inset: 12px;
border: 1px dashed var(–border);
border-radius: 50%;
transition: border-color .2s;
}
#dropzone.dragging .drop-ring::before { border-color: var(–accent); }

.drop-icon {
font-size: 48px;
line-height: 1;
transition: transform .2s;
}
#dropzone.dragging .drop-icon { transform: scale(1.1); }

.drop-label {
font-family: ‘Fraunces’, serif;
font-size: 22px;
font-weight: 100;
color: var(–text);
letter-spacing: .02em;
}
.drop-sub {
color: var(–muted);
font-size: 11px;
letter-spacing: .08em;
text-transform: uppercase;
}
.file-btn {
margin-top: 8px;
background: transparent;
border: 1px solid var(–border);
color: var(–muted);
font-family: inherit;
font-size: 11px;
letter-spacing: .06em;
text-transform: uppercase;
padding: 8px 20px;
cursor: pointer;
border-radius: 2px;
transition: border-color .2s, color .2s;
}
.file-btn:hover { border-color: var(–accent); color: var(–accent); }
#file-input { display: none; }

/* ── App shell ── */
#app {
display: flex; flex-direction: column;
height: 100%;
opacity: 0; pointer-events: none;
transition: opacity .3s;
}
#app.visible { opacity: 1; pointer-events: all; }

/* ── Toolbar ── */
#toolbar {
display: flex; align-items: center; gap: 12px;
padding: 10px 16px;
border-bottom: 1px solid var(–border);
background: var(–surface);
flex-shrink: 0;
}
#toolbar-title {
font-family: ‘Fraunces’, serif;
font-weight: 100;
font-size: 16px;
color: var(–accent);
flex: 1;
white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tb-btn {
background: transparent;
border: 1px solid var(–border);
color: var(–muted);
font-family: inherit;
font-size: 10px;
letter-spacing: .06em;
text-transform: uppercase;
padding: 5px 12px;
cursor: pointer;
border-radius: 2px;
transition: border-color .2s, color .2s;
white-space: nowrap;
}
.tb-btn:hover { border-color: var(–accent); color: var(–accent); }

/* ── Breadcrumb ── */
#breadcrumb {
display: flex; align-items: center; gap: 4px;
padding: 8px 16px;
border-bottom: 1px solid var(–border);
background: var(–surface);
flex-shrink: 0;
overflow-x: auto;
scrollbar-width: none;
}
#breadcrumb::-webkit-scrollbar { display: none; }
.bc-seg {
color: var(–muted);
cursor: pointer;
transition: color .15s;
white-space: nowrap;
font-size: 11px;
}
.bc-seg:hover { color: var(–accent); }
.bc-seg.active { color: var(–text); cursor: default; }
.bc-sep { color: var(–border); font-size: 10px; }

/* ── Explorer ── */
#explorer {
flex: 1;
overflow-y: auto;
padding: 12px 8px;
display: grid;
grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
gap: 2px;
align-content: start;
}
#explorer::-webkit-scrollbar { width: 4px; }
#explorer::-webkit-scrollbar-track { background: transparent; }
#explorer::-webkit-scrollbar-thumb { background: var(–border); border-radius: 2px; }

.entry {
display: flex; flex-direction: column; align-items: center;
padding: 12px 8px;
border-radius: 4px;
cursor: pointer;
transition: background .15s;
gap: 8px;
min-width: 0;
}
.entry:hover { background: var(–surface2); }
.entry:active { background: var(–border); }

.entry-icon {
font-size: 32px;
line-height: 1;
position: relative;
}
.entry-thumb {
width: 56px; height: 56px;
object-fit: cover;
border-radius: 3px;
border: 1px solid var(–border);
display: block;
}
.entry-name {
font-size: 10px;
color: var(–muted);
text-align: center;
word-break: break-all;
line-height: 1.4;
max-height: 2.8em;
overflow: hidden;
width: 100%;
}
.entry.is-dir .entry-name { color: var(–folder); }

/* ── Status bar ── */
#statusbar {
padding: 5px 16px;
border-top: 1px solid var(–border);
background: var(–surface);
color: var(–muted);
font-size: 10px;
letter-spacing: .04em;
flex-shrink: 0;
display: flex; gap: 16px;
}

/* ── Viewer overlay ── */
#viewer {
position: fixed; inset: 0;
background: rgba(10,10,11,.97);
display: flex; flex-direction: column;
z-index: 100;
opacity: 0; pointer-events: none;
transition: opacity .25s;
}
#viewer.open { opacity: 1; pointer-events: all; }

#viewer-topbar {
display: flex; align-items: center; gap: 12px;
padding: 12px 16px;
flex-shrink: 0;
border-bottom: 1px solid var(–border);
}
#viewer-filename {
flex: 1;
font-size: 11px;
color: var(–muted);
white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.vb-btn {
background: transparent;
border: 1px solid var(–border);
color: var(–muted);
font-family: inherit;
font-size: 11px;
padding: 6px 14px;
cursor: pointer;
border-radius: 2px;
transition: border-color .2s, color .2s;
white-space: nowrap;
}
.vb-btn:hover { border-color: var(–accent); color: var(–accent); }
.vb-btn.share-btn:hover { border-color: var(–accent2); color: var(–accent2); }

#viewer-stage {
flex: 1;
position: relative;
overflow: hidden;
display: flex; align-items: center; justify-content: center;
touch-action: pan-y;
}

#viewer-img {
max-width: 100%; max-height: 100%;
object-fit: contain;
display: block;
user-select: none;
transition: transform .25s cubic-bezier(.4,0,.2,1), opacity .2s;
}
#viewer-img.swipe-left  { transform: translateX(-60px); opacity: 0; }
#viewer-img.swipe-right { transform: translateX( 60px); opacity: 0; }
#viewer-img.enter-left  { transform: translateX( 40px); opacity: 0; }
#viewer-img.enter-right { transform: translateX(-40px); opacity: 0; }

.nav-btn {
position: absolute; top: 50%; transform: translateY(-50%);
background: rgba(14,14,15,.7);
border: 1px solid var(–border);
color: var(–muted);
font-size: 18px;
width: 40px; height: 40px;
display: flex; align-items: center; justify-content: center;
cursor: pointer;
border-radius: 2px;
transition: border-color .2s, color .2s, opacity .2s;
z-index: 2;
padding: 0;
font-family: inherit;
}
.nav-btn:hover { border-color: var(–accent); color: var(–accent); }
.nav-btn:disabled { opacity: 0; pointer-events: none; }
#nav-prev { left: 12px; }
#nav-next { right: 12px; }

#viewer-counter {
position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
font-size: 10px; color: var(–muted);
letter-spacing: .08em;
background: rgba(14,14,15,.6);
padding: 4px 10px;
border-radius: 10px;
}

/* ── Toast ── */
#toast {
position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
background: var(–surface2);
border: 1px solid var(–border);
color: var(–text);
font-size: 11px;
padding: 8px 18px;
border-radius: 2px;
opacity: 0;
transition: opacity .2s;
pointer-events: none;
z-index: 200;
white-space: nowrap;
}
#toast.show { opacity: 1; }

/* ── Loading ── */
#loading {
position: fixed; inset: 0;
background: rgba(10,10,11,.9);
display: flex; flex-direction: column;
align-items: center; justify-content: center;
gap: 16px;
z-index: 50;
opacity: 0; pointer-events: none;
transition: opacity .2s;
}
#loading.show { opacity: 1; pointer-events: all; }
.spinner {
width: 32px; height: 32px;
border: 1.5px solid var(–border);
border-top-color: var(–accent);
border-radius: 50%;
animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#loading-label { color: var(–muted); font-size: 11px; letter-spacing: .06em; }
</style>

</head>
<body>

<!-- Drop zone -->

<div id="dropzone">
  <div class="drop-ring">
    <span class="drop-icon">📦</span>
  </div>
  <div>
    <div class="drop-label">ZIP を開く</div>
    <div class="drop-sub" style="text-align:center;margin-top:6px;">drop or select</div>
  </div>
  <button class="file-btn" id="open-btn">ファイルを選択</button>
  <input type="file" id="file-input" accept=".zip">
</div>

<!-- App -->

<div id="app">
  <div id="toolbar">
    <span id="toolbar-title">—</span>
    <button class="tb-btn" id="close-btn">✕ 閉じる</button>
  </div>
  <div id="breadcrumb"></div>
  <div id="explorer"></div>
  <div id="statusbar">
    <span id="status-items">—</span>
    <span id="status-photos">—</span>
  </div>
</div>

<!-- Viewer -->

<div id="viewer">
  <div id="viewer-topbar">
    <span id="viewer-filename">—</span>
    <button class="vb-btn share-btn" id="share-btn">↑ 共有</button>
    <button class="vb-btn" id="viewer-close-btn">✕</button>
  </div>
  <div id="viewer-stage">
    <button class="nav-btn" id="nav-prev">‹</button>
    <img id="viewer-img" src="" alt="">
    <button class="nav-btn" id="nav-next">›</button>
    <div id="viewer-counter">1 / 1</div>
  </div>
</div>

<!-- Loading -->

<div id="loading">
  <div class="spinner"></div>
  <div id="loading-label">展開中…</div>
</div>

<!-- Toast -->

<div id="toast"></div>

<script>
const IMAGE_EXTS = new Set(['jpg','jpeg','png','gif','webp','bmp','tiff','tif','avif','svg','heic','heif']);

// ── State ──
let tree = {};          // nested { name, isDir, path, blob?, children? }
let currentPath = [];   // breadcrumb segments
let photos = [];        // flat list of image paths in current dir
let viewerIndex = 0;
let objectURLs = {};    // path → blob URL cache
let zipName = '';

// ── DOM ──
const dropzone   = document.getElementById('dropzone');
const app        = document.getElementById('app');
const fileInput  = document.getElementById('file-input');
const explorer   = document.getElementById('explorer');
const breadcrumb = document.getElementById('breadcrumb');
const toolbarTitle = document.getElementById('toolbar-title');
const statusItems  = document.getElementById('status-items');
const statusPhotos = document.getElementById('status-photos');
const viewer       = document.getElementById('viewer');
const viewerImg    = document.getElementById('viewer-img');
const viewerFilename = document.getElementById('viewer-filename');
const viewerCounter  = document.getElementById('viewer-counter');
const navPrev = document.getElementById('nav-prev');
const navNext = document.getElementById('nav-next');
const loading = document.getElementById('loading');
const loadingLabel = document.getElementById('loading-label');
const toast   = document.getElementById('toast');

// ── Drop zone ──
document.getElementById('open-btn').addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => { if(e.target.files[0]) loadZip(e.target.files[0]); });

dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('dragging'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragging'));
dropzone.addEventListener('drop', e => {
  e.preventDefault();
  dropzone.classList.remove('dragging');
  const f = e.dataTransfer.files[0];
  if(f && f.name.endsWith('.zip')) loadZip(f);
  else showToast('ZIPファイルのみ対応しています');
});

document.getElementById('close-btn').addEventListener('click', resetApp);

// ── Load ZIP ──
async function loadZip(file) {
  showLoading('展開中…');
  zipName = file.name;
  try {
    const zip = await JSZip.loadAsync(file);
    tree = buildTree(zip);
    currentPath = [];
    // revoke old URLs
    Object.values(objectURLs).forEach(URL.revokeObjectURL);
    objectURLs = {};
    dropzone.classList.add('hidden');
    app.classList.add('visible');
    toolbarTitle.textContent = zipName;
    renderDir();
  } catch(e) {
    showToast('ZIP の読み込みに失敗しました');
    console.error(e);
  } finally {
    hideLoading();
  }
}

function buildTree(zip) {
  const root = { children: {}, isDir: true };
  zip.forEach((relPath, entry) => {
    const parts = relPath.split('/').filter(Boolean);
    let node = root;
    for(let i = 0; i < parts.length; i++) {
      const p = parts[i];
      if(!node.children[p]) {
        node.children[p] = { name: p, isDir: false, children: {}, zipEntry: null };
      }
      if(i < parts.length - 1) {
        node.children[p].isDir = true;
      } else {
        node.children[p].isDir = entry.dir;
        node.children[p].zipEntry = entry;
      }
      node = node.children[p];
    }
  });
  return root;
}

function getCurrentNode() {
  let node = tree;
  for(const seg of currentPath) node = node.children[seg];
  return node;
}

function isImage(name) {
  const ext = name.split('.').pop().toLowerCase();
  return IMAGE_EXTS.has(ext);
}

async function renderDir() {
  explorer.innerHTML = '';
  const node = getCurrentNode();
  const entries = Object.values(node.children).sort((a,b) => {
    if(a.isDir !== b.isDir) return a.isDir ? -1 : 1;
    return a.name.localeCompare(b.name, 'ja');
  });

  // collect photos in this dir
  photos = entries.filter(e => !e.isDir && isImage(e.name))
                  .map(e => [...currentPath, e.name].join('/'));

  let imgCount = 0, dirCount = 0;
  for(const e of entries) {
    if(e.isDir) dirCount++;
    else if(isImage(e.name)) imgCount++;
  }
  statusItems.textContent = `${entries.length} 件`;
  statusPhotos.textContent = `📷 ${imgCount}  📁 ${dirCount}`;

  renderBreadcrumb();

  // render entries
  for(const e of entries) {
    const div = document.createElement('div');
    div.className = 'entry' + (e.isDir ? ' is-dir' : '');

    if(!e.isDir && isImage(e.name)) {
      // lazy thumbnail
      const img = document.createElement('img');
      img.className = 'entry-thumb';
      img.alt = e.name;
      const path = [...currentPath, e.name].join('/');
      loadThumb(img, e, path);
      div.appendChild(img);
      div.addEventListener('click', () => openViewer(path));
    } else {
      const icon = document.createElement('span');
      icon.className = 'entry-icon';
      icon.textContent = e.isDir ? '📁' : fileIcon(e.name);
      div.appendChild(icon);
      if(e.isDir) {
        div.addEventListener('click', () => {
          currentPath.push(e.name);
          renderDir();
        });
      }
    }

    const label = document.createElement('div');
    label.className = 'entry-name';
    label.textContent = e.name;
    div.appendChild(label);
    explorer.appendChild(div);
  }
}

async function loadThumb(imgEl, entry, path) {
  if(objectURLs[path]) { imgEl.src = objectURLs[path]; return; }
  try {
    const blob = await entry.zipEntry.async('blob');
    const url = URL.createObjectURL(blob);
    objectURLs[path] = url;
    imgEl.src = url;
  } catch{}
}

function fileIcon(name) {
  const ext = name.split('.').pop().toLowerCase();
  const m = { pdf:'📄', mp4:'🎬', mov:'🎬', mp3:'🎵', zip:'📦', txt:'📝', json:'📋', md:'📝' };
  return m[ext] || '📄';
}

function renderBreadcrumb() {
  breadcrumb.innerHTML = '';
  const root = document.createElement('span');
  root.className = 'bc-seg' + (currentPath.length === 0 ? ' active' : '');
  root.textContent = zipName || 'root';
  root.addEventListener('click', () => { currentPath = []; renderDir(); });
  breadcrumb.appendChild(root);

  currentPath.forEach((seg, i) => {
    const sep = document.createElement('span');
    sep.className = 'bc-sep'; sep.textContent = ' / ';
    breadcrumb.appendChild(sep);

    const s = document.createElement('span');
    s.className = 'bc-seg' + (i === currentPath.length - 1 ? ' active' : '');
    s.textContent = seg;
    s.addEventListener('click', () => {
      currentPath = currentPath.slice(0, i + 1);
      renderDir();
    });
    breadcrumb.appendChild(s);
  });
}

// ── Viewer ──
async function openViewer(path) {
  viewerIndex = photos.indexOf(path);
  if(viewerIndex === -1) return;
  viewer.classList.add('open');
  await showViewerImage(viewerIndex, null);
  updateNavButtons();
}

async function showViewerImage(idx, direction) {
  const path = photos[idx];
  const name = path.split('/').pop();
  viewerFilename.textContent = path;
  viewerCounter.textContent = `${idx + 1} / ${photos.length}`;

  if(!objectURLs[path]) {
    const node = getNodeByPath(path);
    if(node && node.zipEntry) {
      const blob = await node.zipEntry.async('blob');
      objectURLs[path] = URL.createObjectURL(blob);
    }
  }

  if(direction) {
    // animate out
    viewerImg.classList.add(direction === 'left' ? 'swipe-left' : 'swipe-right');
    await sleep(200);
    viewerImg.classList.remove('swipe-left', 'swipe-right');
    viewerImg.src = objectURLs[path] || '';
    viewerImg.classList.add(direction === 'left' ? 'enter-right' : 'enter-left');
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        viewerImg.classList.remove('enter-right', 'enter-left');
      });
    });
  } else {
    viewerImg.src = objectURLs[path] || '';
  }
}

function getNodeByPath(path) {
  const parts = path.split('/').filter(Boolean);
  let node = tree;
  for(const p of parts) { node = node.children?.[p]; if(!node) return null; }
  return node;
}

function updateNavButtons() {
  navPrev.disabled = viewerIndex <= 0;
  navNext.disabled = viewerIndex >= photos.length - 1;
  viewerCounter.textContent = `${viewerIndex + 1} / ${photos.length}`;
}

navPrev.addEventListener('click', async () => {
  if(viewerIndex > 0) { viewerIndex--; await showViewerImage(viewerIndex, 'right'); updateNavButtons(); }
});
navNext.addEventListener('click', async () => {
  if(viewerIndex < photos.length - 1) { viewerIndex++; await showViewerImage(viewerIndex, 'left'); updateNavButtons(); }
});

document.getElementById('viewer-close-btn').addEventListener('click', () => {
  viewer.classList.remove('open');
});

// ── Share ──
document.getElementById('share-btn').addEventListener('click', async () => {
  const path = photos[viewerIndex];
  const name = path.split('/').pop();
  const url  = objectURLs[path];
  if(!url) return;

  try {
    const resp = await fetch(url);
    const blob = await resp.blob();
    const file = new File([blob], name, { type: blob.type });
    if(navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: name });
    } else if(navigator.share) {
      await navigator.share({ title: name, text: name });
    } else {
      // fallback: download
      const a = document.createElement('a');
      a.href = url; a.download = name; a.click();
      showToast('ダウンロードしました');
    }
  } catch(e) {
    if(e.name !== 'AbortError') showToast('共有に失敗しました');
  }
});

// ── Swipe ──
let touchStartX = 0, touchStartY = 0;
const stage = document.getElementById('viewer-stage');
stage.addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });
stage.addEventListener('touchend', async e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if(Math.abs(dx) < Math.abs(dy) * 1.5 || Math.abs(dx) < 40) return;
  if(dx < 0 && viewerIndex < photos.length - 1) {
    viewerIndex++; await showViewerImage(viewerIndex, 'left'); updateNavButtons();
  } else if(dx > 0 && viewerIndex > 0) {
    viewerIndex--; await showViewerImage(viewerIndex, 'right'); updateNavButtons();
  }
}, { passive: true });

// keyboard
document.addEventListener('keydown', async e => {
  if(!viewer.classList.contains('open')) return;
  if(e.key === 'ArrowRight' && viewerIndex < photos.length - 1) {
    viewerIndex++; await showViewerImage(viewerIndex, 'left'); updateNavButtons();
  } else if(e.key === 'ArrowLeft' && viewerIndex > 0) {
    viewerIndex--; await showViewerImage(viewerIndex, 'right'); updateNavButtons();
  } else if(e.key === 'Escape') {
    viewer.classList.remove('open');
  }
});

// ── Reset ──
function resetApp() {
  app.classList.remove('visible');
  dropzone.classList.remove('hidden');
  viewer.classList.remove('open');
  tree = {}; currentPath = []; photos = []; viewerIndex = 0;
  Object.values(objectURLs).forEach(URL.revokeObjectURL);
  objectURLs = {};
  fileInput.value = '';
  explorer.innerHTML = '';
}

// ── Helpers ──
function showLoading(msg) { loadingLabel.textContent = msg; loading.classList.add('show'); }
function hideLoading() { loading.classList.remove('show'); }

let toastTimer;
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
</script>

</body>
</html>
